version: 2

models:
  - name: dim_station
    description: One row per gas station, with brand and location attributes.
    columns:
      - name: station_id
        description: Primary key — Tankerkönig's stable station UUID.
        tests:
          - unique
          - not_null

  - name: fact_price_observation
    description: One row per station, per fuel type, per price observation.
    columns:
      - name: station_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: fuel_type
        tests:
          - accepted_values:
              arguments:
                values: ['e5', 'e10', 'diesel']